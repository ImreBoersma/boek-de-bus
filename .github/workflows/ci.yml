name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  ci:
    uses: ImreBoersma/projects/.github/workflows/ci-node.yml@main
  deploy:
    needs: ci
    uses: ImreBoersma/projects/.github/workflows/deploy-vercel.yml@main
    secrets: { vercel-token: "${{ secrets.VERCEL_TOKEN }}" }
